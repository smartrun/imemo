[package]
name = "imemo-reader-win"
version = "1.0.0"
edition = "2021"
description = "iMemo Reader for Windows - Non-standard Matrix Code (IMC) Screen Capture & Document Restorer"

[dependencies]
crc32fast = "1.4"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.29", features = ["image"] }
rfd = "0.15"
arboard = "3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
